name: vela
services:
  api:
    image: ${VELA_API_IMAGE:-vela-api:1.0.0}
    container_name: vela-api
    init: true
    user: "10020:10020"
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 0.5
    pids_limit: 64
    environment:
      VELA_BASE_URL: https://vela.home.arpa
      VELA_FRONTEND_DIR: /app/frontend/dist
      VELA_CREDENTIALS_DIR: /credentials
      VELA_STORAGE_MARKER: vela-unas-unprotected-698f83b4-014e-482f-8aa1-d5a75e65b39a
      VELA_TRUSTED_PROXIES: 172.29.50.0/28
    volumes:
      - type: bind
        source: /srv/vela/credentials
        target: /credentials
        bind: {create_host_path: false}
      - type: bind
        source: /srv/vela/state
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: /srv/vela/library/Vela
        target: /downloads
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ["/tmp:size=32m,mode=1777"]
    networks:
      proxy:
        ipv4_address: 172.29.50.3
        aliases: [vela-api]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/api/health',headers={'Host':'vela.home.arpa'}),timeout=3); assert r.status==200"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
  worker:
    image: ${VELA_WORKER_IMAGE:-vela-worker:1.0.0}
    container_name: vela-worker
    init: true
    user: "10020:10020"
    restart: "no"
    stop_grace_period: 30s
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1
    pids_limit: 128
    environment:
      VELA_CREDENTIALS_DIR: /credentials
      VELA_STORAGE_MARKER: vela-unas-unprotected-698f83b4-014e-482f-8aa1-d5a75e65b39a
      VELA_MAX_WORK_BYTES: "17179869184"
      VELA_MIN_FREE_BYTES: "2147483648"
      VELA_MAX_PLAYLIST_ITEMS: "100"
    volumes:
      - type: bind
        source: /srv/vela/credentials
        target: /credentials
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/vela/state
        target: /state
        bind: {create_host_path: false}
      - type: bind
        source: /srv/vela/work
        target: /work
        bind: {create_host_path: false}
      - type: bind
        source: /srv/vela/library/Vela
        target: /downloads
        bind: {create_host_path: false}
    tmpfs: ["/tmp:size=64m,mode=1777"]
    networks:
      worker:
        ipv4_address: 172.29.51.2
    healthcheck:
      test: [CMD, python, -m, vela.cli, health, worker]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s
    logging: {driver: local, options: {max-size: 10m, max-file: "3"}}
networks:
  proxy: {external: true, name: vela_proxy}
  worker: {external: true, name: vela_worker}
